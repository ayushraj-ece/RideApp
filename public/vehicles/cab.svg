<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <filter id="shadowCab" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="cabBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cabYellowStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="windshieldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadowCab)">
    <!-- Side Mirrors -->
    <ellipse cx="14" cy="52" rx="6" ry="10" fill="#0f172a" transform="rotate(-15 14 52)"/>
    <ellipse cx="106" cy="52" rx="6" ry="10" fill="#0f172a" transform="rotate(15 106 52)"/>

    <!-- Main Car Body Outline (Top-Down Sedan View) -->
    <path d="M 38,12 C 48,8 72,8 82,12 L 96,35 C 102,60 102,120 96,150 L 88,168 C 72,174 48,174 32,168 L 24,150 C 18,120 18,60 24,35 Z" fill="url(#cabBody)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Yellow Accent Stripes on Sides / Roof -->
    <path d="M 22,40 C 20,70 20,110 22,140 L 28,140 C 26,110 26,70 28,40 Z" fill="url(#cabYellowStripe)"/>
    <path d="M 98,40 C 100,70 100,110 98,140 L 92,140 C 94,110 94,70 92,40 Z" fill="url(#cabYellowStripe)"/>

    <!-- Hood Contour -->
    <path d="M 34,16 Q 60,22 86,16 L 90,44 Q 60,48 30,44 Z" fill="#f1f5f9"/>

    <!-- Front Windshield -->
    <path d="M 30,46 Q 60,40 90,46 L 84,72 Q 60,68 36,72 Z" fill="url(#windshieldGlass)"/>
    <path d="M 34,48 Q 60,43 86,48" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Car Roof -->
    <path d="M 34,74 Q 60,70 86,74 L 84,122 Q 60,126 36,122 Z" fill="#e2e8f0"/>

    <!-- Roof Cab Branding Sign (Yellow Top Light) -->
    <rect x="42" y="88" width="36" height="12" rx="4" fill="url(#cabYellowStripe)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="60" y="97" font-size="7" font-weight="900" font-family="sans-serif" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">CAB</text>

    <!-- Rear Windshield -->
    <path d="M 36,124 Q 60,128 84,124 L 88,144 Q 60,148 32,144 Z" fill="url(#windshieldGlass)"/>

    <!-- Trunk Contour -->
    <path d="M 30,146 Q 60,150 90,146 L 86,166 Q 60,172 34,166 Z" fill="#f1f5f9"/>

    <!-- Front Headlights (White/Yellow LED Glow) -->
    <ellipse cx="28" cy="18" rx="6" ry="4" fill="#fef08a" transform="rotate(-15 28 18)"/>
    <ellipse cx="92" cy="18" rx="6" ry="4" fill="#fef08a" transform="rotate(15 92 18)"/>

    <!-- Rear Taillights (Red LED Strips) -->
    <path d="M 24,154 L 36,156 L 34,164 L 25,162 Z" fill="#ef4444"/>
    <path d="M 96,154 L 84,156 L 86,164 L 95,162 Z" fill="#ef4444"/>
  </g>
</svg>

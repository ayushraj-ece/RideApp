<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="yellowBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="helmetYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="visorDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tireTread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Rear Tire -->
    <rect x="52" y="142" width="16" height="32" rx="6" fill="url(#tireTread)"/>
    <rect x="55" y="145" width="10" height="26" rx="4" fill="#1e293b"/>

    <!-- Front Tire -->
    <rect x="53" y="6" width="14" height="30" rx="5" fill="url(#tireTread)"/>
    <rect x="56" y="8" width="8" height="24" rx="3" fill="#1e293b"/>

    <!-- Front Mudguard / Fender -->
    <path d="M 48,22 Q 60,12 72,22 L 70,42 Q 60,45 50,42 Z" fill="url(#yellowBody)"/>

    <!-- Handlebars -->
    <path d="M 22,46 L 98,46" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <path d="M 22,46 L 98,46" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Grips -->
    <rect x="16" y="41" width="10" height="10" rx="2" fill="#0f172a"/>
    <rect x="94" y="41" width="10" height="10" rx="2" fill="#0f172a"/>
    <!-- Side Mirrors -->
    <ellipse cx="14" cy="35" rx="7" ry="4" fill="#334155" transform="rotate(-20 14 35)"/>
    <ellipse cx="106" cy="35" rx="7" ry="4" fill="#334155" transform="rotate(20 106 35)"/>

    <!-- Bike Frame & Fuel Tank -->
    <path d="M 42,44 C 42,38 78,38 78,44 L 84,82 C 84,95 36,95 36,82 Z" fill="url(#yellowBody)"/>
    <!-- Tank Cap -->
    <circle cx="60" cy="58" r="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

    <!-- Captain / Rider Body -->
    <!-- Shoulders & Arms -->
    <path d="M 26,75 C 26,58 38,50 48,50 L 72,50 C 82,50 94,58 94,75 L 88,110 C 88,118 32,118 32,110 Z" fill="#0f172a"/>
    <!-- Yellow Jacket Stripes -->
    <path d="M 28,76 Q 60,86 92,76" stroke="#eab308" stroke-width="5" fill="none"/>
    <path d="M 32,96 Q 60,104 88,96" stroke="#eab308" stroke-width="4" fill="none"/>

    <!-- Driver Helmet (Top-Down View) -->
    <circle cx="60" cy="72" r="22" fill="url(#helmetYellow)" stroke="#0f172a" stroke-width="2"/>
    <!-- Helmet Visor -->
    <path d="M 44,57 Q 60,48 76,57 C 76,64 44,64 44,57 Z" fill="url(#visorDark)"/>
    <path d="M 46,58 Q 60,51 74,58" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.8"/>

    <!-- Bike Main Seat -->
    <path d="M 40,106 L 80,106 C 82,122 78,138 68,144 L 52,144 C 42,138 38,122 40,106 Z" fill="#1e293b"/>
    <path d="M 44,110 Q 60,114 76,110" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Taillight -->
    <rect x="52" y="143" width="16" height="5" rx="2" fill="#ef4444"/>
    <!-- License Plate -->
    <rect x="48" y="148" width="24" height="6" rx="1" fill="#f8fafc" stroke="#64748b" stroke-width="0.5"/>
  </g>
</svg>
